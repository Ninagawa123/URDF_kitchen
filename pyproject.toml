[project]
name = "urdf-kitchen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "nodegraphqt>=0.6.43",
    "numpy>=2.4.2",
    "pycollada>=0.9.3",
    "pyside6>=6.10.1",
    "trimesh>=4.11.1",
    "vtk>=9.5.2",
    "xacrodoc>=1.3.1",
    "gmsh>=4.15.1",
    "coacd>=1.0.7",
    "scipy>=1.10",
    "lxml>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["mesh_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
